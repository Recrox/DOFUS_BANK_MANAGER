# Publie automatiquement une Release quand la version change.
#
# Il suffit d'augmenter <Version> dans DofusBankManager/DofusBankManager.csproj et de pousser sur main :
# ce workflow construit l'installateur, crée le tag vX.Y.Z et publie la Release avec le .msi.
# Si la Release de cette version existe déjà, il ne fait rien.
name: Release

on:
  push:
    branches: [main]
    paths:
      - DofusBankManager/DofusBankManager.csproj
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content DofusBankManager/DofusBankManager.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "Aucune <Version> dans le .csproj" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Version : $version"

      - name: Vérifier si la Release existe déjà
        id: exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.version.outputs.version }}" *> $null
          $exists = $LASTEXITCODE -eq 0
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($exists) { "La Release v${{ steps.version.outputs.version }} existe déjà : rien à faire." }
          exit 0

      - name: Installer .NET 10
        if: steps.exists.outputs.exists == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Construire l'installateur
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        run: ./build-installer.ps1

      - name: Publier la Release
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release create $tag dist/DofusBankManager-Setup.msi `
            --target "${{ github.sha }}" `
            --title $tag `
            --generate-notes
